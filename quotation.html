<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ใบเสนอราคา - บริษัท เค แอล สเตชั่นเนอรี่ จำกัด</title>
    <!-- Google Fonts: Sarabun & Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-dark: #4338ca;
            --primary-light: #e0e7ff;
            --secondary-color: #1e293b;
            --border-color: #cbd5e1;
            --bg-light: #f8fafc;
            --success-color: #10b981;
            --danger-color: #ef4444;
            --shadow-subtle: 0 10px 30px -5px rgba(79, 70, 229, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
            --radius-box: 16px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Sarabun', 'Inter', sans-serif;
            background: linear-gradient(135deg, #f6f8fb 0%, #eef2f7 100%);
            color: var(--secondary-color);
            margin: 0;
            padding: 30px 15px 60px 15px;
            font-size: 13px;
            line-height: 1.5;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        /* Sticky Action Toolbar (No Print) */
        .toolbar {
            position: sticky;
            top: 20px;
            z-index: 1000;
            max-width: 900px;
            margin: 0 auto 30px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            padding: 14px 28px;
            border-radius: var(--radius-box);
            box-shadow: 0 15px 35px -5px rgba(79, 70, 229, 0.12), 0 5px 15px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        .toolbar-title {
            font-weight: 700; 
            color: var(--primary-color); 
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .toolbar-actions {
            display: flex;
            gap: 12px;
        }

        .btn-action {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            color: white;
            border: none;
            border-radius: 10px;
            padding: 10px 20px;
            font-family: inherit;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-action:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(79, 70, 229, 0.4);
            filter: brightness(1.05);
        }

        .btn-success {
            background: linear-gradient(135deg, var(--success-color), #059669);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }
        .btn-success:hover {
            box-shadow: 0 6px 16px rgba(16, 185, 129, 0.4);
        }

        /* Container & Page Layout for Print */
        .page-sheet {
            max-width: 900px;
            margin: 0 auto 35px auto;
            background: #ffffff;
            padding: 40px;
            box-shadow: var(--shadow-subtle);
            border-radius: var(--radius-box);
            position: relative;
            border: 1px solid rgba(226, 232, 240, 0.8);
        }

        /* Header Section */
        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 18px;
            margin-bottom: 18px;
        }

        .header-left {
            display: flex;
            gap: 18px;
            align-items: flex-start;
        }

        .logo-container img {
            width: 75px;
            height: auto;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .shop-info-box .company-name {
            font-weight: 700;
            font-size: 16px;
            color: var(--primary-dark);
            margin-bottom: 4px;
        }

        .shop-info-box .address-text, 
        .shop-info-box .tax-text {
            color: #64748b;
            font-size: 11px;
            line-height: 1.5;
        }

        .title-box {
            text-align: right;
        }

        .title-main {
            font-size: 22px;
            font-weight: 800;
            color: var(--primary-color);
            letter-spacing: 0.5px;
            line-height: 1.2;
        }

        .title-sub {
            font-size: 11px;
            font-weight: 600;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-top: 2px;
        }

        /* Top Info Grid */
        .top-info {
            width: 100%;
            margin-bottom: 18px;
            border-collapse: collapse;
        }

        .top-info td {
            vertical-align: top;
            padding: 6px;
        }

        .customer-info-box {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            padding: 14px;
            border-radius: 12px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.01);
        }

        .no-date-box {
            background-color: var(--primary-light);
            border: 1px solid #c7d2fe;
            padding: 14px;
            border-radius: 12px;
            box-shadow: inset 0 2px 4px rgba(79, 70, 229, 0.02);
        }

        .info-row {
            margin-bottom: 8px;
            display: flex;
            align-items: baseline;
        }
        .info-row:last-child {
            margin-bottom: 0;
        }

        .info-label {
            font-weight: 600;
            color: #475569;
            min-width: 130px;
            font-size: 12px;
        }

        .inline-input {
            border: none;
            border-bottom: 1.5px dashed var(--border-color);
            outline: none;
            font-family: inherit;
            font-size: inherit;
            padding: 3px 6px;
            color: var(--secondary-color);
            background: transparent;
            transition: all 0.25s ease;
        }

        .inline-input:focus {
            border-bottom: 1.5px solid var(--primary-color);
            background-color: #fff;
            border-radius: 4px;
            box-shadow: 0 2px 5px rgba(79, 70, 229, 0.08);
        }

        .inline-textarea {
            border: 1px solid var(--border-color);
            border-radius: 8px;
            outline: none;
            font-family: inherit;
            font-size: inherit;
            padding: 6px 8px;
            resize: none;
            height: 45px;
            width: 100%;
            background: #fff;
            transition: all 0.25s ease;
        }

        .inline-textarea:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }

        /* Table Styling */
        .table-responsive-wrapper {
            margin-bottom: 15px;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        .data-table th, .data-table td {
            border: 1px solid var(--border-color);
            padding: 8px 10px;
        }

        .data-table th {
            background: linear-gradient(135deg, #f1f5f9, #e2e8f0);
            color: #334155;
            text-align: center;
            font-weight: 700;
            font-size: 12px;
            letter-spacing: 0.3px;
        }

        .item-desc {
            width: 100%;
            border: none;
            outline: none;
            resize: none;
            font-family: inherit;
            font-size: inherit;
            background: transparent;
            height: 22px;
            overflow: hidden;
        }

        .sku-input, .qty, .price, .unit-input {
            width: 100%;
            border: none;
            outline: none;
            text-align: inherit;
            font-family: inherit;
            font-size: inherit;
            background: transparent;
        }

        .qty, .price {
            text-align: right !important;
        }

        .sku-input, .unit-input {
            text-align: center !important;
        }

        .btn-del {
            background-color: #fee2e2;
            color: var(--danger-color);
            border: none;
            padding: 4px 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-del:hover {
            background-color: var(--danger-color);
            color: white;
            transform: scale(1.05);
        }

        /* Footer & Summary Table */
        .footer-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 18px;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .footer-table td {
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            font-size: 12px;
        }

        .footer-total-label {
            background-color: var(--bg-light);
            font-weight: 600;
            color: #475569;
        }

        /* Signature Section */
        .signature-section {
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
            gap: 25px;
            page-break-inside: avoid;
        }

        .sig-box {
            flex: 1;
            text-align: center;
            border: 1px solid var(--border-color);
            padding: 18px 15px;
            border-radius: 12px;
            background-color: #f8fafc;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }

        .sig-line {
            border-bottom: 1.5px dotted #94a3b8;
            margin: 35px 15px 10px 15px;
        }

        .sig-name-input {
            border: none;
            border-bottom: 1.5px dashed var(--border-color);
            text-align: center;
            width: 90%;
            outline: none;
            font-family: inherit;
            margin-bottom: 6px;
            font-size: 12px;
            padding-bottom: 2px;
        }

        .sig-text {
            font-size: 12px;
            color: #334155;
            font-weight: 700;
        }

        .sig-date {
            font-size: 11px;
            color: #64748b;
            margin-top: 6px;
        }

        .sig-date-input {
            border: none;
            border-bottom: 1.5px dashed var(--border-color);
            text-align: center;
            width: 110px;
            outline: none;
            font-family: inherit;
        }

        /* Dynamic Pages Container for Print Pagination */
        #print-pages-container {
            display: flex;
            flex-direction: column;
            gap: 35px;
        }

        /* Print Settings */
        @media print {
            body {
                background-color: #ffffff;
                padding: 0;
                font-size: 12px;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            .toolbar, .no-print {
                display: none !important;
            }
            /* Container & Page Layout for Print */
        .page-sheet {
            max-width: 900px;
            margin: 0 auto 20px auto;
            background: #ffffff;
            padding: 15px 20px; /* ลด padding บน-ล่าง จาก 40px เหลือ 24px */
            box-shadow: var(--shadow-subtle);
            border-radius: var(--radius-box);
            position: relative;
            border: 1px solid rgba(226, 232, 240, 0.8);
        }

        /* Header Section */
        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 6px;
            margin-bottom: 6px;
        }

        /* Top Info Grid */
        .top-info {
            width: 100%;
            margin-bottom: 6px; /* ลดระยะห่างลง */
            border-collapse: collapse;
        }

        .customer-info-box, .no-date-box {
            padding: 18px 10px; /* ลด padding ภายในกล่องข้อมูล */
        }

        /* Table Styling */
        .table-responsive-wrapper {
            margin-bottom: 6px; /* ลดระยะห่างตารางสินค้า */
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .data-table th, .data-table td {
            border: 1px solid var(--border-color);
            padding: 3px 6px; /* ลดความสูงของช่องตารางลงเล็กน้อย */
        }

        /* Footer & Summary Table */
        .footer-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 6px; /* ลดระยะห่างตารางสรุป */
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .footer-table td {
            border: 1px solid var(--border-color);
            padding: 3px 8px;; /* ลด padding ลง */
        }

        /* Signature Section */
        .signature-section {
            display: flex;
            justify-content: space-between;
            margin-top: 10px; /* ลดระยะห่างด้านบนของลายเซ็น */
            gap: 20px;
            page-break-inside: avoid;
        }

        .sig-box {
            flex: 1;
            text-align: center;
            border: 1px solid var(--border-color);
            padding: 8px 10px; /* ลด padding กล่องลายเซ็น */
            border-radius: 12px;
            background-color: #f8fafc;
        }

        .sig-line {
            border-bottom: 1.5px dotted #94a3b8;
            margin: 15px 10px 4px 10px; /* ลดพื้นที่ว่างสำหรับเซ็นชื่อ */
        }
    </style>
</head>
<body>

<!-- แถบเครื่องมือควบคุมแบบลอยเด่น (Sticky Toolbar) พร้อมปุ่มกลับหน้า index.html -->
<div class="toolbar no-print">
    <div class="toolbar-actions" style="gap: 10px;">
        <a href="index.html" class="btn-action btn-secondary">🏠 หน้าแรก</a>
    </div>
    <div class="toolbar-actions">
        <button class="btn-action btn-success" onclick="addRow()">+ เพิ่มรายการสินค้า</button>
        <button class="btn-action" onclick="window.print()">🖨️ พิมพ์เอกสาร / บันทึก PDF</button>
    </div>
</div>

<!-- พื้นที่แสดงหน้าเอกสารทั้งหมด -->
<div id="print-pages-container"></div>

<script>
// ฟังก์ชันสำรองกัน Error กรณีที่ยังไม่ได้เขียนเชื่อมต่อระบบ Cloud จริง
function initRealtimeMasterData() {
    // สามารถใส่โค้ดเชื่อมต่อ Firebase ของคุณตรงนี้ในอนาคต
    console.log("Realtime Master Data initialized.");
}
    // ปรับให้ดึงวันที่ปัจจุบันอัตโนมัติ (รูปแบบ DD/MM/YYYY)
    const today = new Date();
    const day = String(today.getDate()).padStart(2, '0');
    const month = String(today.getMonth() + 1).padStart(2, '0');
    const year = today.getFullYear();
    const currentDateFormatted = `${day}/${month}/${year}`;

    // สร้างเลขที่ใบเสนอราคาอัตโนมัติจากปีและเดือนปัจจุบัน (เช่น QT202606...)
// 🔍 ดึงค่า Query Parameters จาก URL (ที่ส่งมาจากหน้า index.html)
    const urlParams = new URLSearchParams(window.location.search);
    const paramBillNo = urlParams.get('billNo');
    const paramBookNo = urlParams.get('bookNo');

    // สร้างเลขที่ใบเสนอราคาอัตโนมัติสำรอง (กรณีที่ไม่มีการส่งค่ามา)
    const autoBillNo = paramBillNo || `QT${year}${month}001`;

    let docMeta = {
        custName: "",
        custAddress: "",
        quotSubject: "",
        quotEnclose: "-",
        bookNo: paramBookNo || "-",
        billNo: autoBillNo,          // แสดงเลขที่บิลที่ดึงมาจาก index อัตโนมัติ
        billDate: currentDateFormatted, 
        remarkText: "ราคานี้ยังไม่รวมภาษีมูลค่าเพิ่ม / ยืนราคา 30 วัน",
        discountRate: 0,
        sigCustomerName: "",
        sigCustomerDate: "",
        sigSalesName: "",
        sigSalesDate: currentDateFormatted 
    };

    let itemsData = [
        { desc: "", model: "", qty: 1, unit: "", price: 0.00 },
        { desc: "", model: "", qty: 1, unit: "", price: 0.00 },
        { desc: "", model: "", qty: 1, unit: "", price: 0.00 },
        { desc: "", model: "", qty: 1, unit: "", price: 0.00 },
        { desc: "", model: "", qty: 1, unit: "", price: 0.00 },
        { desc: "", model: "", qty: 1, unit: "", price: 0.00 },
        { desc: "", model: "", qty: 1, unit: "", price: 0.00 },
        { desc: "", model: "", qty: 1, unit: "", price: 0.00 },
        { desc: "", model: "", qty: 1, unit: "", price: 0.00 },
        { desc: "", model: "", qty: 1, unit: "", price: 0.00 },
        { desc: "", model: "", qty: 1, unit: "", price: 0.00 },
        { desc: "", model: "", qty: 1, unit: "", price: 0.00 }
    ];

    // กำหนดให้แสดงรายการสินค้าหน้าละไม่เกิน 5 รายการ และบังคับแสดงตารางสรุปท้ายหน้าเสมอ
    const ITEMS_PER_PAGE = 10; 

function renderDocument() {
    const container = document.getElementById("print-pages-container");
    container.innerHTML = "";

    const totalPages = Math.ceil(itemsData.length / ITEMS_PER_PAGE) || 1;

    for (let pageIdx = 0; pageIdx < totalPages; pageIdx++) {
        const startIdx = pageIdx * ITEMS_PER_PAGE;
        const endIdx = Math.min(startIdx + ITEMS_PER_PAGE, itemsData.length);
        const pageItems = itemsData.slice(startIdx, endIdx);
        const isLastPage = (pageIdx === totalPages - 1);

        const pageDiv = document.createElement("div");
        pageDiv.className = "page-sheet";
        // เพิ่ม attribute ระบุหน้า เพื่อให้ฟังก์ชันคำนวณเข้าถึงแต่ละหน้าได้ถูกต้อง
        pageDiv.setAttribute("data-page-index", pageIdx);
        pageDiv.setAttribute("data-is-last", isLastPage ? "true" : "false");

        let pageHTML = `
            <div class="header-section">
                <div class="header-left">
                    <div class="logo-container">
                        <img src="logo.png" alt="KL Logo" onerror="this.style.display='none'">
                    </div>
                    <div class="shop-info-box">
                        <div class="company-name">บริษัท เค แอล สเตชั่นเนอรี่ จำกัด (สำนักงานใหญ่)</div>
                        <div class="address-text">873, 875 ถนนสุขุมวิท 105 แขวงบางนาใต้ เขตบางนา กรุงเทพมหานคร 10260</div>
                        <div class="address-text">โทร. 0-2748-6788 | เลขประจำตัวผู้เสียภาษี: 0105544005337</div>
                    </div>
                </div>
                <div class="title-box">
                    <div class="title-main">ใบเสนอราคา</div>
                    <div class="title-sub">QUOTATION</div>
                    <div style="font-size: 11px; color: #64748b; margin-top: 4px; font-weight: 600;">หน้าที่ ${pageIdx + 1} / ${totalPages}</div>
                </div>
            </div>

            <table class="top-info">
                <tr>
                    <td style="width: 58%;">
                        <div class="customer-info-box">
                            <div class="info-row no-print" style="margin-bottom: 10px;">
                                <span class="info-label" style="color: var(--primary-color);">🔍 เลือกลูกค้า:</span>
                                <select id="customerSelect" class="inline-input customerSelect" style="width: 180px; font-weight: 600;" onchange="selectCustomer(this)">
							<option value="">-- เลือกลูกค้า --</option>
							</select>
                            </div>
                            <div class="info-row">
                                <span class="info-label">นามลูกค้า (Attention):</span>
                                <input type="text" class="inline-input meta-field" data-field="custName" style="flex:1;" value="${docMeta.custName}" placeholder="ชื่อบริษัท/ลูกค้า...">
                            </div>
                            <div class="info-row" style="align-items: flex-start; margin-top: 6px;">
                                <span class="info-label">ที่อยู่ (Address):</span>
                                <textarea class="inline-textarea meta-field" data-field="custAddress" placeholder="ที่อยู่ลูกค้า...">${docMeta.custAddress}</textarea>
                            </div>
                            <div class="info-row" style="margin-top: 6px;">
                                <span class="info-label">เรื่อง (Subject):</span>
                                <input type="text" class="inline-input meta-field" data-field="quotSubject" style="flex:1;" value="${docMeta.quotSubject}" placeholder="หัวข้อเรื่อง...">
                            </div>
                            <div class="info-row" style="margin-top: 6px;">
                                <span class="info-label">สิ่งที่ส่งมาด้วย:</span>
                                <input type="text" class="inline-input meta-field" data-field="quotEnclose" style="flex:1;" value="${docMeta.quotEnclose}">
                            </div>
                        </div>
                    </td>
                    <td style="width: 42%; padding-left: 10px;">
                        <div class="no-date-box">
                            <div class="info-row no-print" style="margin-bottom: 8px;">
                                <span class="info-label" style="color: var(--primary-color); min-width: 90px;">🔍 ค้นหาบิล:</span>
                                <input type="text" id="searchOldBillNo" class="inline-input" style="width: 90px;" placeholder="เลขที่บิล">
                                <button class="btn-action" style="padding: 2px 6px; font-size: 10px;" onclick="loadDataByBillNo()">ดึงรายการบิล</button>
                            </div>
                            <div class="info-row">
                                <span class="info-label" style="min-width: 95px;">เล่มที่ (Book No.):</span>
                                <input type="text" class="inline-input meta-field" data-field="bookNo" style="flex:1;" value="${docMeta.bookNo}">
                            </div>
                            <div class="info-row" style="margin-top: 6px;">
                                <span class="info-label" style="min-width: 95px;">เลขที่ (No.):</span>
                                <input type="text" class="inline-input meta-field" data-field="billNo" style="flex:1; font-weight: 700; color: var(--primary-color);" value="${docMeta.billNo}">
                            </div>
                            <div class="info-row" style="margin-top: 6px;">
                                <span class="info-label" style="min-width: 95px;">วันที่ (Date):</span>

    function updateMeta(field, value) {

        itemsData[index][field] = value;
        if (field === 'qty' || field === 'price') {

function calculateTotals() {
    let subTotal = 0;

    itemsData.forEach((item) => {
        const qty = parseFloat(String(item.qty).replace(/,/g, '')) || 0;
        const price = parseFloat(String(item.price).replace(/,/g, '')) || 0;
        subTotal += (qty * price);
    });

    let discountRate = parseFloat(docMeta.discountRate);
    let discountAmount = 0;

    if (isNaN(discountRate) || discountRate <= 0) {
        discountRate = 0;
        discountAmount = 0;
    } else {
        discountAmount = (subTotal * discountRate) / 100;
    }

    let netTotal = subTotal - discountAmount;
    if (netTotal < 0) netTotal = 0;

    let vatAmount = netTotal * 0.07;
    let grandTotal = netTotal + vatAmount;
    let thaiTextStr = arabicToThaiText(grandTotal);

    // วนลูปจัดการแสดงผลแยกตามแต่ละหน้า (Page Sheet)
    const pageSheets = document.querySelectorAll(".page-sheet");
    const totalPages = pageSheets.length;

    pageSheets.forEach((sheet) => {
        const isLast = sheet.getAttribute("data-is-last") === "true";

        // ถ้าเป็นหน้าสุดท้าย หรือมีหน้าเดียว ให้แสดงยอดเงินคำนวณจริง
        // ถ้าไม่ใช่หน้าสุดท้าย (และมีหลายหน้า) ให้แสดงเป็น 0.00 ทั้งหมด
        const displaySubTotal = (totalPages === 1 || isLast) ? subTotal.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : "0.00";
        const displayDiscount = (totalPages === 1 || isLast) ? discountAmount.toFixed(2) : "0.00";
        const displayNetTotal = (totalPages === 1 || isLast) ? netTotal.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : "0.00";
        const displayVat     = (totalPages === 1 || isLast) ? vatAmount.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : "0.00";
        const displayGrand   = (totalPages === 1 || isLast) ? grandTotal.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : "0.00";
        const displayThaiText = (totalPages === 1 || isLast) ? thaiTextStr : "ศูนย์บาทถ้วน";

        // เซ็ตค่าลงใน Element เฉพาะของหน้านั้น ๆ
        const subTotalEl = sheet.querySelector(".subTotal");
        const discountRateEl = sheet.querySelector(".discountRate");
        const discountAmountEl = sheet.querySelector(".discountAmount");
        const netTotalEl = sheet.querySelector(".netTotal");
        const vatAmountEl = sheet.querySelector(".vatAmount");
        const grandTotalEl = sheet.querySelector(".grandTotal");
        const textAmountEl = sheet.querySelector(".textAmount");

        if (subTotalEl) subTotalEl.textContent = displaySubTotal;
        if (discountRateEl) discountRateEl.value = discountRate;
        if (discountAmountEl) discountAmountEl.value = displayDiscount;
        if (netTotalEl) netTotalEl.textContent = displayNetTotal;
        if (vatAmountEl) vatAmountEl.textContent = displayVat;
        if (grandTotalEl) grandTotalEl.textContent = displayGrand;
        if (textAmountEl) textAmountEl.textContent = displayThaiText;
    });

    // อัปเดตตารางรายการสินค้าแต่ละแถวตามปกติ
    const rows = document.querySelectorAll(".item-row");
    rows.forEach((row, idx) => {
        if (itemsData[idx]) {
            const q = parseFloat(String(itemsData[idx].qty).replace(/,/g, '')) || 0;
            const p = parseFloat(String(itemsData[idx].price).replace(/,/g, '')) || 0;
            const amtCell = row.querySelector(".amount");
            if (amtCell) {
                amtCell.textContent = (q * p).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            }
        }
    });
}

    function arabicToThaiText(amount) {
        if (amount === 0) return "ศูนย์บาทถ้วน";
        const arabicNumber = amount.toFixed(2);
        const splitNum = arabicNumber.split(".");
        let integerPart = splitNum[0];
        let decimalPart = splitNum[1];

        let thaiText = convertIntegerToThai(integerPart) + "บาท";
        if (decimalPart === "00") {
            thaiText += "ถ้วน";
        } else {
            thaiText += convertIntegerToThai(decimalPart) + "สตางค์";
        }
        return thaiText;
    }

    function convertIntegerToThai(numStr) {
        const thaiNums = ["ศูนย์", "หนึ่ง", "สอง", "สาม", "สี่", "ห้า", "หก", "เจ็ด", "แปด", "เก้า"];
        const thaiUnits = ["", "สิบ", "ร้อย", "พัน", "หมื่น", "แสน", "ล้าน"];
        let result = "";
        let len = numStr.length;

        for (let i = 0; i < len; i++) {
            let digit = parseInt(numStr[i]);
            let pos = len - i - 1;

            if (digit !== 0) {
                if (pos === 1 && digit === 1) {
                    result += "สิบ";
                } else if (pos === 1 && digit === 2) {
                    result += "ยี่สิบ";
                } else if (pos === 0 && digit === 1 && len > 1 && parseInt(numStr[len - 2]) !== 0) {
                    result += "เอ็ด";
                } else {
                    result += thaiNums[digit] + thaiUnits[pos % 6];
                }
            }
        }
        return result;
    }

// สมมติว่าเก็บอาเรย์ลูกค้าไว้ในตัวแปรร่วม (Global Variable) เพื่อให้เรียกใช้งานง่าย
let allCustomersData = []; 

// นำฟังก์ชันอัปเดต Dropdown ของคุณมาปรับนิดหน่อยให้เก็บข้อมูลดิบไว้ด้วย
function updateCustomerDropdownUI(customers) {
    allCustomersData = customers; // เก็บข้อมูลทั้งหมดไว้ใช้งานต่อ
    let select = document.getElementById('customerSelect');
    if (!select) return;

    let currentSelected = select.value;
    select.innerHTML = '<option value="">-- เลือกลูกค้า/บริษัท --</option>';

    customers.forEach((c) => {
        let custName = '';
        if (typeof c === 'string') {
            custName = c;
        } else if (c) {
            custName = c.name || c.customerName || c.companyName || '';
        }

        if (custName) {
            let opt = document.createElement('option');
            opt.value = custName; // ใช้ชื่อเป็นค่า value
            opt.innerText = custName;
            select.appendChild(opt);
        }
    });

    if (currentSelected) {
        select.value = currentSelected;
    }
}

// 3. ฟังก์ชันดึงรายชื่อลูกค้าแบบเดิม (ปรับให้เรียกใช้ระบบ Real-time)
function loadCustomerDropdown() {

    let localCustomers = JSON.parse(localStorage.getItem('saved_quot_customers') || '[]');
    if (localCustomers.length > 0) {
        updateCustomerDropdownUI(localCustomers);
    }
    
    // เริ่มเปิดระบบ Real-time ฟังข้อมูลจาก Cloud
    initRealtimeMasterData();
}

 async function loadDataByBillNo() {
    const bNo = document.getElementById("searchOldBillNo").value.trim();
    if (!bNo) {
        alert("กรุณากรอกเลขที่บิลที่ต้องการค้นหา");
        return;
    }

    let foundBill = null;

    // 1. ค้นหาจาก Firebase Firestore ก่อน (ถ้ามีการใช้งาน Firebase ในระบบ)
    try {
        if (typeof firebase !== 'undefined' && firebase.apps && firebase.apps.length > 0) {
            const db = firebase.firestore();
            // ลองค้นหาจาก collection 'quotations' หรือปรับชื่อตามโครงสร้างของคุณ
            const docRef = await db.collection("quotations").doc(bNo).get();
            if (docRef.exists) {
                foundBill = docRef.data();
            }
        }
    } catch (error) {
        console.warn("⚠️ ไม่สามารถดึงข้อมูลจาก Cloud ได้, กำลังตรวจสอบในเครื่อง...", error);
    }

    // 2. ถ้าไม่เจอใน Cloud ให้ค้นหาจาก LocalStorage ทั้ง 2 รูปแบบเดิมของคุณ
    if (!foundBill) {
        let savedBills = [];
        const source1 = localStorage.getItem('saved_quotations');
        const source2 = localStorage.getItem('saved_quot_purchases');

        if (source1) {
            try { savedBills = savedBills.concat(JSON.parse(source1)); } catch(e){}
        }
        if (source2) {
            try { savedBills = savedBills.concat(JSON.parse(source2)); } catch(e){}
        }

        // ค้นหาบิลที่ตรงกับเลขที่กรอก (เทียบแบบไม่สนตัวพิมพ์เล็ก-ใหญ่ หรือช่องว่างส่วนเกิน)
        foundBill = savedBills.find(b => {
            let currentBillNo = (b.billNo || b.quotationNo || '').toString().trim();
            return currentBillNo === bNo;
        });
    }

    // 3. หากพบข้อมูล นำมาใส่ลงในตัวแปรและวาดหน้าจอใหม่
    if (foundBill) {
        // ดึงข้อมูลหัวบิลมาใส่ (รองรับชื่อฟิลด์ที่อาจแตกต่างกัน)
        docMeta.custName = foundBill.custName || foundBill.customerName || "";
        docMeta.custAddress = foundBill.custAddress || foundBill.address || "";
        docMeta.quotSubject = foundBill.quotSubject || foundBill.subject || "";
        docMeta.quotEnclose = foundBill.quotEnclose || foundBill.enclose || "-";
        docMeta.bookNo = foundBill.bookNo || "-";
        docMeta.billNo = foundBill.billNo || foundBill.quotationNo || autoBillNo;
        docMeta.billDate = foundBill.billDate || currentDateFormatted;
        docMeta.discountRate = foundBill.discountRate || foundBill.discount || 0;
        docMeta.remarkText = foundBill.remarkText || foundBill.remark || "";

        // ดึงรายการสินค้ามาแทนที่ itemsData (รองรับทุกชื่อฟิลด์ที่อาจเคยบันทึกไว้)
        let rawItems = foundBill.items || foundBill.productList || foundBill.details || [];
        if (rawItems && rawItems.length > 0) {
            itemsData = rawItems.map(item => ({
                desc: item.desc || item.description || item.productName || "",
                model: item.model || item.sku || "-",
                qty: parseFloat(item.qty || item.quantity) || 1,
                unit: item.unit || "ชิ้น",
                price: parseFloat(item.price || item.unitPrice || item.unit_price || item.productPrice) || 0.00
            }));
        } else {
            itemsData = []; // ป้องกันกรณีบิลเก่าไม่มีสินค้าติดมา
        }

        // วาดหน้าจอใหม่และคำนวณยอดเงินทั้งหมด
        if (typeof renderDocument === 'function') {
            renderDocument();
        }
        
        alert("ดึงข้อมูลใบเสนอราคาเลขที่: " + bNo + " สำเร็จ!");
    } else {
        alert("ไม่พบข้อมูลเลขที่ใบเสนอราคานี้ในระบบ กรุณาตรวจสอบความถูกต้องอีกครั้ง");
    }
}

window.onload = function() {
        // แก้ไขจาก calculate() เป็น calculateTotals() ที่มีอยู่จริงในระบบ
        calculateTotals();
        loadCustomerDropdown();
        renderDocument(); // เพิ่มการเรียกเรนเดอร์เอกสารเริ่มต้น
        
        let dateField = document.getElementById('billDate');
        let sigSalesDate = document.getElementById('sigSalesDate');
        let sigCustDate = document.getElementById('sigCustomerDate');
        let billNoField = document.getElementById('billNo');
        
        let d = new Date();
        let day = String(d.getDate()).padStart(2, '0');
        let month = String(d.getMonth() + 1).padStart(2, '0');
        let year = d.getFullYear() + 543;
        let currentDateStr = `${day}/${month}/${year}`;

        if(!dateField || !dateField.value) docMeta.billDate = currentDateStr;
        if(!sigSalesDate || !sigSalesDate.value) docMeta.sigSalesDate = currentDateStr;

        // 📌 ดึงเลขที่บิลล่าสุดจาก LocalStorage มาแสดงอัตโนมัติ (ถ้าต้องการเปิดใช้งาน)
        if (billNoField && !billNoField.value) {
            let purchases = JSON.parse(localStorage.getItem('saved_quot_purchases') || '[]');
            if (purchases.length > 0) {
                let latestBill = purchases[purchases.length - 1];
                if (latestBill && latestBill.billNo) {
                     billNoField.value = latestBill.billNo;
                     docMeta.billNo = latestBill.billNo;
                }
            }
        }
        
        renderDocument();
    };
	
// ฟังก์ชันดึงข้อมูลลูกค้ามาแสดงในฟอร์มเมื่อเลือกจาก Dropdown
function selectCustomer(selectElement) {
    const selectedName = selectElement.value;
    
    let foundCustomer = null;
    if (typeof allCustomersData !== 'undefined' && Array.isArray(allCustomersData)) {
        foundCustomer = allCustomersData.find(c => {
            let cName = typeof c === 'string' ? c : (c.name || c.customerName || c.companyName || '');
            return cName === selectedName;
        });
    }

    let custNameValue = "";
    let custAddressValue = "";
    let custItems = null;

    if (foundCustomer && typeof foundCustomer === 'object') {
        custNameValue = foundCustomer.name || foundCustomer.customerName || foundCustomer.companyName || selectedName;
        custAddressValue = foundCustomer.address || foundCustomer.custAddress || '';
        // สมมติว่าในข้อมูลลูกค้ามีการผูกรายการสินค้าประจำไว้ เช่น c.items
        custItems = foundCustomer.items || null;
    } else {
        custNameValue = selectedName;
        custAddressValue = "";
    }

    // อัปเดตข้อมูลลูกค้า
    docMeta.custName = custNameValue;
    docMeta.custAddress = custAddressValue;

    // ถ้าลูกค้ารายนี้มีรายการสินค้าผูกไว้ ให้ดึงมาแสดงแทนที่แถวว่าง
    if (custItems && Array.isArray(custItems) && custItems.length > 0) {
        itemsData = custItems;
    }

    // เรนเดอร์หน้าจอใหม่เพื่อให้ข้อมูลอัปเดตทั้งที่อยู่และรายการสินค้า
    renderDocument();
}

        if (searchInput) {

            // สั่งให้เรียกฟังก์ชันค้นหาและดึงข้อมูลบิลขึ้นมาแสดงอัตโนมัติทันที
            if (typeof loadDataByBillNo === 'function') {
                loadDataByBillNo();
            }
        }
    }
});



</script>
